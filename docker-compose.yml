services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lexbridge
      POSTGRES_PASSWORD: lexbridge
      POSTGRES_DB: lexbridge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexbridge -d lexbridge"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - lexbridge-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak/realm-lexbridge.json:/opt/keycloak/data/import/realm-lexbridge.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 25s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://lexbridge:lexbridge@postgres:5432/lexbridge
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:3000
      API_ORIGIN: http://localhost:4000
      PORT: 4000
      OIDC_ISSUER: http://localhost:8180/realms/lexbridge
      OIDC_CLIENT_ID: lexbridge-api
      OIDC_CLIENT_SECRET: lexbridge-dev-secret
      OIDC_REDIRECT_URI: http://localhost:4000/auth/callback
      COOKIE_SECURE: "false"
      SESSION_TTL_SECONDS: 28800
      EXPORT_DIR: /data/exports
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    extra_hosts:
      - "localhost:host-gateway"
    volumes:
      - lexbridge-exports:/data/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://lexbridge:lexbridge@postgres:5432/lexbridge
      REDIS_URL: redis://redis:6379
      EXPORT_DIR: /data/exports
    volumes:
      - lexbridge-exports:/data/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_ORIGIN: http://localhost:4000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_ORIGIN: http://localhost:4000
    depends_on:
      api:
        condition: service_healthy

volumes:
  lexbridge-postgres:
  lexbridge-exports:
