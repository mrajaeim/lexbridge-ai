name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lexbridge
          POSTGRES_PASSWORD: lexbridge
          POSTGRES_DB: lexbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexbridge -d lexbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://lexbridge:lexbridge@localhost:5432/lexbridge
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000
      API_ORIGIN: http://localhost:4000
      OIDC_ISSUER: http://localhost:8180/realms/lexbridge
      OIDC_CLIENT_ID: lexbridge-api
      OIDC_CLIENT_SECRET: lexbridge-dev-secret
      OIDC_REDIRECT_URI: http://localhost:4000/auth/callback
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
